name: Validate

on:
  pull_request:
  push:
    branches: [main, fix/complete-avatar-pipeline]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q main.py utils blender_scripts

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
